<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Libre Baskerville";
        font-style: normal;
        font-weight: 400;
        src: url("./fonts/LibreBaskerville-normal-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Libre Baskerville";
        font-style: italic;
        font-weight: 400;
        src: url("./fonts/LibreBaskerville-italic-400.woff2") format("woff2");
      }
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 500;
        src: url("./fonts/Inter-normal-500.woff2") format("woff2");
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f7f4ef;
      }

      body {
        color: #1c1915;
        font-family: "Libre Baskerville", Georgia, serif;
      }

      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.045;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }

      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid #2c4a3e;
        pointer-events: none;
      }

      .frame-inner {
        position: absolute;
        inset: 34px;
        border: 1px solid #c9c3b8;
        pointer-events: none;
      }

      .lockup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .mark {
        width: 56px;
        height: 56px;
        margin-bottom: 28px;
        color: #2c4a3e;
      }

      h1 {
        font-weight: 400;
        font-size: 92px;
        line-height: 0.95;
        letter-spacing: -0.02em;
        color: #1c1915;
      }

      .rule {
        width: 72px;
        height: 1px;
        margin: 22px 0 18px;
        background: #8a5a22;
      }

      .bank {
        font-size: 28px;
        line-height: 1;
        letter-spacing: 0.01em;
        color: #2c4a3e;
      }

      .tag {
        margin-top: 26px;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 500;
        font-size: 13px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #6e675c;
        padding-left: 0.34em;
      }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true"></div>
    <div class="frame-inner" aria-hidden="true"></div>
    <main class="lockup">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" stroke="currentColor" stroke-width="1.25"/>
        <path fill="currentColor" fill-rule="evenodd" d="M16 6.5 8 24.5h3.1l1.55-3.7h6.7l1.55 3.7H24L16 6.5Zm0 5.2 2.15 5.1h-4.3L16 11.7Z"/>
      </svg>
      <h1>Ashcombe</h1>
      <div class="rule"></div>
      <p class="bank">Private Bank</p>
      <p class="tag">A distinguished institution</p>
    </main>
  </body>
</html>
